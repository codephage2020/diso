name: Validate skill and examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Validate the committed example
        run: python scripts/check.py examples/diso-btree-index.html
      - name: Rebuild the example without modifying tracked files
        run: |
          python scripts/build.py examples/btree-index.json -o "$RUNNER_TEMP/btree.html"
          diff -u examples/diso-btree-index.html "$RUNNER_TEMP/btree.html"
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/render-tools" --no-package-lock playwright@1.63.0
          "$RUNNER_TEMP/render-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render all modes on desktop and mobile
        run: NODE_PATH="$RUNNER_TEMP/render-tools/node_modules" node tests/render_smoke.cjs "$RUNNER_TEMP/render-output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-pages
          path: ${{ runner.temp }}/render-output
          if-no-files-found: error
